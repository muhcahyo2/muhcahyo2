name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run generate
        env:
          # If you have build-time secrets, add them here
          # NUXT_APP_CDN_URL: ${{ secrets.NUXT_APP_CDN_URL }}
          NODE_ENV: production

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: muhcahyo2 # Ensure this matches your Cloudflare Pages project name
          directory: .output/public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Enable if you want to use the branch name as the deployment environment
          # branch: main
